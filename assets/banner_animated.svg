<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="40%" stop-color="#C9A84C" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#C9A84C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>

    <filter id="title-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#C9A84C" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f26" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)"/>

  <!-- Grid Pattern -->
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Vignette -->
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- Top & Bottom Accent Lines -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#gold-line)" opacity="0.6"/>
  <rect x="0" y="299" width="1200" height="1" fill="url(#gold-line)" opacity="0.6"/>

  <!-- Decorative Side Lines -->
  <line x1="80" y1="150" x2="370" y2="150" stroke="#C9A84C" stroke-width="0.6" opacity="0.3"/>
  <line x1="830" y1="150" x2="1120" y2="150" stroke="#C9A84C" stroke-width="0.6" opacity="0.3"/>

  <!-- Diamond Accents -->
  <polygon points="72,150 80,142 88,150 80,158" fill="#C9A84C" opacity="0.5"/>
  <polygon points="1112,150 1120,142 1128,150 1120,158" fill="#C9A84C" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="138" text-anchor="middle" fill="#C9A84C"
    font-family="Georgia,'Times New Roman',serif"
    font-size="78" font-weight="bold" letter-spacing="5"
    filter="url(#title-glow)">ADAM MUHAMMAD</text>

  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" fill="#9a8660"
    font-family="Georgia,'Times New Roman',serif"
    font-size="22" letter-spacing="10">ENGINEER  ·  INTEGRATOR  ·  BUILDER</text>

  <!-- Subtle Corner Dots -->
  <circle cx="40" cy="40" r="2" fill="#C9A84C" opacity="0.3"/>
  <circle cx="1160" cy="40" r="2" fill="#C9A84C" opacity="0.3"/>
  <circle cx="40" cy="260" r="2" fill="#C9A84C" opacity="0.3"/>
  <circle cx="1160" cy="260" r="2" fill="#C9A84C" opacity="0.3"/>
</svg>
