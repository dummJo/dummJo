<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- ============ PALETTE ============
         void      #07050d
         deep      #150a26
         violet    #8b5cf6
         arcane    #a855f7
         rune      #c77dff
         gold      #C9A84C
         pale      #f0e2b0
    ==================================== -->

    <linearGradient id="void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0714"/>
      <stop offset="45%" stop-color="#120a20"/>
      <stop offset="100%" stop-color="#06040c"/>
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#5b21b6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <linearGradient id="edge-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold with a slow travelling highlight -->
    <linearGradient id="gilded" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#b08d3a"/>
      <stop offset="42%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#fff3cd"/>
      <stop offset="58%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#b08d3a"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1.1 0; -1.1 0; 1.1 0" keyTimes="0; 0.55; 1"
        dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rune-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Twin-tone aura: violet bloom under a gold rim -->
    <filter id="aura" x="-25%" y="-90%" width="150%" height="280%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="wide"/>
      <feFlood flood-color="#8b5cf6" flood-opacity="0.55" result="v"/>
      <feComposite in="v" in2="wide" operator="in" result="violetGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="tight"/>
      <feFlood flood-color="#C9A84C" flood-opacity="0.45" result="g"/>
      <feComposite in="g" in2="tight" operator="in" result="goldGlow"/>
      <feMerge>
        <feMergeNode in="violetGlow"/>
        <feMergeNode in="goldGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sigil-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="lattice" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#2a1d45" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="0.9" fill="#5b21b6" opacity="0.5"/>
    </pattern>

  </defs>

  <!-- ================= GROUND ================= -->
  <rect width="1200" height="340" fill="url(#void)"/>
  <rect width="1200" height="340" fill="url(#lattice)"/>
  <rect width="1200" height="340" fill="url(#core-glow)"/>

  <!-- ============ GREAT CIRCLE OF SUMMONING ============ -->
  <g transform="translate(600,170)" opacity="0.55">

    <!-- outer rune band, turning slowly clockwise -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="120s" repeatCount="indefinite"/>
      <circle r="150" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.55"/>
      <circle r="138" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.35"/>
      <circle r="144" fill="none" stroke="#c77dff" stroke-width="5"
              stroke-dasharray="1.5 14" opacity="0.45"/>
      <g fill="none" stroke="url(#rune-fade)" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round" filter="url(#sigil-glow)">
        <g transform="rotate(0)   translate(0,-118)"><path d="M-5,-8 L-5,8 M-5,-8 L5,-2 L-5,4"/></g>
        <g transform="rotate(30)  translate(0,-118)"><path d="M-5,8 L-5,-8 L5,8 L5,-8"/></g>
        <g transform="rotate(60)  translate(0,-118)"><path d="M-5,-8 L5,8 M5,-8 L-5,8"/></g>
        <g transform="rotate(90)  translate(0,-118)"><path d="M0,-8 L0,8 M-5,-4 L5,-4"/></g>
        <g transform="rotate(120) translate(0,-118)"><path d="M-5,-8 L0,0 L-5,8 M0,0 L6,0"/></g>
        <g transform="rotate(150) translate(0,-118)"><path d="M-5,8 L0,-8 L5,8"/></g>
        <g transform="rotate(180) translate(0,-118)"><path d="M-5,-8 L-5,8 L5,8"/></g>
        <g transform="rotate(210) translate(0,-118)"><path d="M-4,-8 L4,-8 M0,-8 L0,8"/></g>
        <g transform="rotate(240) translate(0,-118)"><path d="M-5,0 L0,-8 L5,0 L0,8 Z"/></g>
        <g transform="rotate(270) translate(0,-118)"><path d="M-5,-8 L5,-8 L-5,8 L5,8"/></g>
        <g transform="rotate(300) translate(0,-118)"><path d="M0,-8 L0,8 M0,-2 L6,-8 M0,-2 L-6,-8"/></g>
        <g transform="rotate(330) translate(0,-118)"><path d="M-5,-6 L5,-6 M-5,0 L5,0 M-5,6 L5,6"/></g>
      </g>
    </g>

    <!-- inner octagram, turning counter to the band -->
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="rotate"
        from="360" to="0" dur="80s" repeatCount="indefinite"/>
      <polygon points="0,-96 96,0 0,96 -96,0" fill="none"
               stroke="#C9A84C" stroke-width="0.7" opacity="0.5"/>
      <polygon points="0,-96 96,0 0,96 -96,0" fill="none"
               stroke="#a855f7" stroke-width="0.7" opacity="0.5"
               transform="rotate(45)"/>
      <circle r="96" fill="none" stroke="#5b21b6" stroke-width="0.6" opacity="0.55"/>
      <circle r="62" fill="none" stroke="#5b21b6" stroke-width="0.5" opacity="0.4"/>
    </g>

    <!-- breathing halo -->
    <circle r="150" fill="none" stroke="#c77dff" stroke-width="0.8" opacity="0.25">
      <animate attributeName="r" values="150;168;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0;0.25" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ FLANKING STAFF SIGILS ============ -->
  <g transform="translate(150,170)" opacity="0.75" filter="url(#sigil-glow)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="-360" dur="34s" repeatCount="indefinite"/>
      <polygon points="0,-26 26,0 0,26 -26,0" fill="none" stroke="#a855f7" stroke-width="1"/>
      <polygon points="0,-18 18,0 0,18 -18,0" fill="none" stroke="#C9A84C" stroke-width="0.8"
               transform="rotate(45)"/>
    </g>
    <circle r="4" fill="#c77dff">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(1050,170)" opacity="0.75" filter="url(#sigil-glow)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="34s" repeatCount="indefinite"/>
      <polygon points="0,-26 26,0 0,26 -26,0" fill="none" stroke="#a855f7" stroke-width="1"/>
      <polygon points="0,-18 18,0 0,18 -18,0" fill="none" stroke="#C9A84C" stroke-width="0.8"
               transform="rotate(45)"/>
    </g>
    <circle r="4" fill="#c77dff">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite" begin="1.6s"/>
    </circle>
  </g>

  <!-- ============ RISING EMBERS ============ -->
  <g fill="#c77dff">
    <circle cx="215"  cy="300" r="1.6" opacity="0"><animate attributeName="cy" values="310;40"  dur="11s" repeatCount="indefinite" begin="0s"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="330"  cy="300" r="1.2" opacity="0"><animate attributeName="cy" values="315;60"  dur="14s" repeatCount="indefinite" begin="2s"/><animate attributeName="opacity" values="0;0.6;0" dur="14s" repeatCount="indefinite" begin="2s"/></circle>
    <circle cx="455"  cy="300" r="1.8" opacity="0"><animate attributeName="cy" values="320;50"  dur="12s" repeatCount="indefinite" begin="4.5s"/><animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite" begin="4.5s"/></circle>
    <circle cx="600"  cy="300" r="1.3" opacity="0"><animate attributeName="cy" values="318;35"  dur="15s" repeatCount="indefinite" begin="1.2s"/><animate attributeName="opacity" values="0;0.75;0" dur="15s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="745"  cy="300" r="1.6" opacity="0"><animate attributeName="cy" values="312;55"  dur="13s" repeatCount="indefinite" begin="6s"/><animate attributeName="opacity" values="0;0.65;0" dur="13s" repeatCount="indefinite" begin="6s"/></circle>
    <circle cx="880"  cy="300" r="1.2" opacity="0"><animate attributeName="cy" values="316;45"  dur="10s" repeatCount="indefinite" begin="3.4s"/><animate attributeName="opacity" values="0;0.7;0" dur="10s" repeatCount="indefinite" begin="3.4s"/></circle>
    <circle cx="985"  cy="300" r="1.7" opacity="0"><animate attributeName="cy" values="314;65"  dur="16s" repeatCount="indefinite" begin="7.5s"/><animate attributeName="opacity" values="0;0.6;0" dur="16s" repeatCount="indefinite" begin="7.5s"/></circle>
  </g>
  <g fill="#C9A84C">
    <circle cx="275" cy="300" r="1.1" opacity="0"><animate attributeName="cy" values="308;70" dur="13.5s" repeatCount="indefinite" begin="5s"/><animate attributeName="opacity" values="0;0.55;0" dur="13.5s" repeatCount="indefinite" begin="5s"/></circle>
    <circle cx="675" cy="300" r="1.4" opacity="0"><animate attributeName="cy" values="311;48" dur="12.5s" repeatCount="indefinite" begin="8.2s"/><animate attributeName="opacity" values="0;0.6;0" dur="12.5s" repeatCount="indefinite" begin="8.2s"/></circle>
    <circle cx="930" cy="300" r="1.1" opacity="0"><animate attributeName="cy" values="309;62" dur="15.5s" repeatCount="indefinite" begin="2.8s"/><animate attributeName="opacity" values="0;0.5;0" dur="15.5s" repeatCount="indefinite" begin="2.8s"/></circle>
  </g>

  <!-- ============ VIGNETTE + FRAME ============ -->
  <rect width="1200" height="340" fill="url(#vignette)"/>
  <rect x="0" y="0"   width="1200" height="1" fill="url(#edge-rule)"/>
  <rect x="0" y="339" width="1200" height="1" fill="url(#edge-rule)"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.45">
    <path d="M30,18 L18,18 L18,30"/>
    <path d="M1170,18 L1182,18 L1182,30"/>
    <path d="M30,322 L18,322 L18,310"/>
    <path d="M1170,322 L1182,322 L1182,310"/>
  </g>

  <!-- ============ NAMEPLATE ============ -->
  <text x="600" y="163" text-anchor="middle" fill="url(#gilded)"
    font-family="'Aptos Display', Aptos, 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="72" font-weight="600" letter-spacing="8"
    filter="url(#aura)">ADAM MUHAMMAD</text>

  <line x1="420" y1="188" x2="780" y2="188" stroke="#a855f7" stroke-width="0.7" opacity="0.5"/>
  <polygon points="600,182 606,188 600,194 594,188" fill="#C9A84C" opacity="0.8"/>

  <text x="600" y="219" text-anchor="middle" fill="#b9a1e8"
    font-family="Aptos, 'Segoe UI Variable Text', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="18" font-weight="500" letter-spacing="9">ENGINEER  ·  INTEGRATOR  ·  BUILDER</text>

  <text x="600" y="252" text-anchor="middle" fill="#7c6a9c"
    font-family="'Aptos Mono', 'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, monospace"
    font-size="11" letter-spacing="5">OT — IT CONVERGENCE</text>
</svg>
